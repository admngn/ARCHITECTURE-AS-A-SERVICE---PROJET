groups:
  - name: students-app
    rules:
      # L'app ne répond plus depuis 1 minute
      - alert: AppDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L'application students-app est DOWN"
          description: "{{ $labels.instance }} ne répond plus depuis 1 minute."

      # Temps de réponse > 2 secondes
      - alert: HighLatency
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée sur students-app"
          description: "{{ $labels.instance }} met plus de 2s à répondre."

      # Prometheus lui-même consomme trop de mémoire
      - alert: PrometheusHighMemory
        expr: process_resident_memory_bytes{job="prometheus"} > 1e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus utilise plus de 1Go de RAM"
